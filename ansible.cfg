[defaults]
inventory = inventory/hosts.ini
host_key_checking = true
retry_files_enabled = false
inject_facts_as_vars = false   ; факты — только через ansible_facts['...'], без top-level проброса (удалён в 2.24)

[privilege_escalation]
become = false
become_method = sudo
become_user = root
become_ask_pass = false

[ssh_connection]
pipelining = true
; метод передачи файлов: sftp (по умолчанию smart) может залипать на части сетей;
; piped гонит файл через stdin/stdout ssh-канала — тот же транспорт, что и команды
transfer_method = piped
