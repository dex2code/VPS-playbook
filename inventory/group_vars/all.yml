# --- Переменные для всех Debian-хостов ---

# Этот файл соответствует зарезервированной встроенной группе `all`
# (без суффикса _grp, переименовывать нельзя) и применяется к каждому
# хосту инвентори — в том числе к тем, кто появится в других группах.

# Python на удалённых хостах
# На Debian 10+ python3 предустановлен — Ansible работает без доп. шагов
ansible_python_interpreter: /usr/bin/python3
